[package]
name = "rsomics-seqio"
version = "0.5.1"
description = "Strict allocation-reusing FASTA/FASTQ streaming I/O with transparent gzip and BGZF input"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-seqio"
authors = ["Zane Leong <efd@live.com>"]
categories = ["science"]
keywords = ["fasta", "fastq", "bioinformatics", "bgzf", "gzip"]
readme = "README.md"

[dependencies]
rsomics-common = "0.12"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crossbeam-channel = "0.5"
noodles-bgzf = { version = "0.47", features = ["libdeflate"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "seqio_gz"
harness = false
